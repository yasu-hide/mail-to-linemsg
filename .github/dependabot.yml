version: 2

registries:
  # Dockerfile の base image (dhi.io, Docker Hardened Images) は認証が必要。
  # Dependabot シークレット (Actions シークレットとは別) DHI_USERNAME / DHI_TOKEN を登録すること。
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DHI_USERNAME}}
    password: ${{secrets.DHI_TOKEN}}

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # minimatch を 3.1.4 に固定しているため c8 は ^9 系に結合している
      # (c8@10+ は minimatch@9+ を要求し test-exclude の named import と衝突する)
      - dependency-name: "c8"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - dhi
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
